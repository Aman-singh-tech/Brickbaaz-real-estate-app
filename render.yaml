# Render Blueprint: web service on Render, external PostgreSQL on Neon.
# Dashboard > New > Blueprint > pick this repo. Fill the variables marked "sync: false" when asked.
services:
  - type: web
    name: brickbaaz
    runtime: node
    region: singapore
    plan: free # switch to starter before real users
    buildCommand: npm install && npm run build
    # Runs pending DB migrations on every start (works on the free plan). Move it to preDeployCommand on paid plans.
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /welcome
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # Neon PostgreSQL URL with sslmode=require; configured in Render Environment.
      - key: OWNER_HOST
        sync: false # owner app hostname, e.g. owner.brickbaaz.com (leave empty to serve everything on one host)
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false # e.g. https://brickbaaz.onrender.com (no trailing slash)
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: OWNER_PHONE
        sync: false
      - key: SUPPORT_PHONE
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

# The former Render database is intentionally no longer provisioned by this Blueprint.
# Removing its definition does not delete the existing database or its recovery export.
